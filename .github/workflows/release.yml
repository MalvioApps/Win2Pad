name: release

# Push a tag such as v0.1.0 to publish that version: tests, a self-contained build, the Velopack
# installer and update packages, and a GitHub release the installed apps update from.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3, got ${{ github.ref_name }}" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test Win2Pad.sln -c Release

      - name: Publish
        run: >
          dotnet publish src/Win2Pad.App/Win2Pad.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -p:DebugType=none
          -o publish

      - name: Install Velopack
        run: dotnet tool install -g vpk --version 1.2.161

      # Earlier releases let Velopack build small delta updates; the first release has none.
      - name: Download previous release
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: >
          vpk pack
          --packId Win2Pad
          --packVersion ${{ steps.version.outputs.value }}
          --packDir publish
          --mainExe Win2Pad.exe
          --packTitle Win2Pad
          --packAuthors MalvioApps
          --icon src/Win2Pad.App/Assets/win2pad.ico

      - name: Upload release
        run: >
          vpk upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "Win2Pad ${{ steps.version.outputs.value }}"
          --tag ${{ github.ref_name }}
